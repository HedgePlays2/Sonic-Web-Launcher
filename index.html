<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sonic Origins Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="launcher">

    <!-- GAME PAGES -->
    <div class="game active">
      <img src="logos/sonic1.png" class="logo">
      <a href="https://hedgeplays2.github.io/sonic-1-jsdlivr/" class="play">PLAY</a>
    </div>

    <div class="game">
      <img src="logos/sonic2.png" class="logo">
      <a href="https://hedgeplays2.github.io/Sonic2-Web-Port/" class="play">PLAY</a>
    </div>

    <div class="game">
      <img src="logos/soniccd.png" class="logo">
      <a href="https://hedgeplays2.github.io/Sonic-CD-Web/" class="play">PLAY</a>
    </div>

    <div class="game">
      <img src="logos/sonic3.png" class="logo">
      <a href="https://projects.sappharad.com/s3air_ios/20260328_beta/sonic3air_web.html" class="play">PLAY</a>
    </div>

    <!-- ORIGINS ARROWS -->
    <button id="left" class="arrow">◀</button>
    <button id="right" class="arrow">▶</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
